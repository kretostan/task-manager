services:
  app:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      target: dev
    ports:
      - "5173:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
    volumes:
      - ../src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      disable: true
