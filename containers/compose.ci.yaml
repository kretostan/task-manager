services:
  app:
    env_file: !reset []
    environment:
      MONGO_URI: mongodb://ci:ci-password@mongodb:27017/task-manager-ci?authSource=admin
      NEXTAUTH_SECRET: ci-dummy-secret
      NEXTAUTH_URL: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ci
      MONGO_INITDB_ROOT_PASSWORD: ci-password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
