services:
  app:
    image: ghcr.io/kretostan/task-manager:${IMAGE_SHA?:IMAGE_SHA is required}
    ports:
      - "8080:3000"
    env_file:
      - ../.env
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
